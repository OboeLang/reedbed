name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# a new push to the same branch supersedes an in-flight run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build & test (gcc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # unlike the oboe repository, no build artifacts are committed here, so
      # there is no stale-object hazard and no `make clean` dance
      - name: Build and run the test suite
        working-directory: server
        run: make test

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pinned to match oboe's, and to match what is used locally; minor
      # releases disagree on enough edge cases that an unpinned clang-format
      # fails on CI only
      - name: Install clang-format
        run: pip install --disable-pip-version-check clang-format==22.1.8

      - name: Check formatting
        run: clang-format --dry-run -Werror $(git ls-files '*.c' '*.h')

  warnings:
    name: warnings-as-errors (clang)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # -Werror rides on CC rather than CFLAGS so the Makefile's flags stay the
      # single source of truth and cannot drift out of sync with this workflow
      - name: Build with -Werror
        working-directory: server
        run: make CC="clang -Werror"

  macos:
    name: build & test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # the protocol tests bind a loopback socket and fork, so this is a real
      # check that the server works on darwin and not only on glibc
      - name: Build and run the test suite
        working-directory: server
        run: make test
